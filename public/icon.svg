<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Royal Indigo & Velvet Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="40%" stop-color="#312E81" />
      <stop offset="75%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Emerald Teal Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Luxury Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glass Roof / Facet Highlight -->
    <linearGradient id="glassRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#E0E7FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0.7" />
    </linearGradient>

    <!-- Building Body Gradient -->
    <linearGradient id="towerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="towerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.45" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Smooth Squircle Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Overlay -->
  <circle cx="256" cy="180" r="180" fill="#818CF8" fill-opacity="0.18" filter="url(#glow)" />
  <circle cx="380" cy="140" r="90" fill="#F59E0B" fill-opacity="0.22" filter="url(#glow)" />

  <!-- Architectural Real Estate Emblem Structure -->
  <g filter="url(#softShadow)">
    
    <!-- Secondary Skyscraper (Left) -->
    <path d="M128 240 L208 195 L208 400 C208 408 202 414 194 414 L142 414 C134 414 128 408 128 400 Z" fill="url(#towerGrad2)" />
    <!-- Skyscraper Windows (Left) -->
    <g fill="#4F46E5" fill-opacity="0.4">
      <rect x="146" y="240" width="16" height="24" rx="4" />
      <rect x="174" y="240" width="16" height="24" rx="4" />
      <rect x="146" y="280" width="16" height="24" rx="4" />
      <rect x="174" y="280" width="16" height="24" rx="4" />
      <rect x="146" y="320" width="16" height="24" rx="4" />
      <rect x="174" y="320" width="16" height="24" rx="4" />
      <rect x="146" y="360" width="16" height="24" rx="4" />
      <rect x="174" y="360" width="16" height="24" rx="4" />
    </g>

    <!-- Main Architectural House / Center Luxury Villa -->
    <!-- Pitch Roof / Modern Geometric Gable -->
    <path d="M256 108 L170 178 C164 183 166 194 174 198 L256 238 L338 198 C346 194 348 183 342 178 Z" fill="url(#glassRoof)" />

    <!-- Center Villa Facade -->
    <path d="M184 210 L184 410 C184 418 190 424 198 424 L314 424 C322 424 328 418 328 410 L328 210 L256 174 Z" fill="url(#towerGrad1)" />

    <!-- Modern Ribbon Windows / Balcony -->
    <rect x="204" y="236" width="104" height="34" rx="8" fill="#4338CA" fill-opacity="0.85" />
    <rect x="208" y="240" width="46" height="26" rx="5" fill="#6366F1" fill-opacity="0.5" />
    <rect x="258" y="240" width="46" height="26" rx="5" fill="#6366F1" fill-opacity="0.5" />

    <!-- Lower Floor Panoramic Glass -->
    <rect x="204" y="292" width="104" height="38" rx="8" fill="#4338CA" fill-opacity="0.85" />
    <rect x="210" y="296" width="28" height="30" rx="4" fill="#818CF8" fill-opacity="0.45" />
    <rect x="242" y="296" width="28" height="30" rx="4" fill="#818CF8" fill-opacity="0.45" />
    <rect x="274" y="296" width="28" height="30" rx="4" fill="#818CF8" fill-opacity="0.45" />

    <!-- Luxury Portal / Entrance Archway -->
    <path d="M236 424 L236 364 C236 354 245 346 256 346 C267 346 276 354 276 364 L276 424 Z" fill="url(#bgGrad)" />
    <!-- Doorway Warm Accent Light -->
    <rect x="252" y="374" width="8" height="28" rx="4" fill="url(#goldGrad)" />

    <!-- Modern Right Wing Tower -->
    <path d="M304 220 L384 175 C390 171 398 175 398 182 L398 400 C398 408 392 414 384 414 L324 414 Z" fill="url(#towerGrad2)" />
    <g fill="#4F46E5" fill-opacity="0.35">
      <rect x="340" y="230" width="40" height="14" rx="4" />
      <rect x="340" y="260" width="40" height="14" rx="4" />
      <rect x="340" y="290" width="40" height="14" rx="4" />
      <rect x="340" y="320" width="40" height="14" rx="4" />
      <rect x="340" y="350" width="40" height="14" rx="4" />
    </g>

    <!-- Foundation Platform with Emerald Verified Ribbon -->
    <rect x="110" y="416" width="292" height="12" rx="6" fill="url(#emeraldGrad)" />
  </g>

  <!-- Glowing Golden AI Sparkle (Top Right Beacon) -->
  <g transform="translate(356, 94)">
    <!-- 4-pointed radiant AI star -->
    <path d="M36 0 C36 20 52 36 72 36 C52 36 36 52 36 72 C36 52 20 36 0 36 C20 36 36 20 36 0 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="36" cy="36" r="6" fill="#FFFFFF" />
  </g>

  <!-- Smaller Micro Star (Left) -->
  <g transform="translate(136, 140) scale(0.55)">
    <path d="M24 0 C24 13 35 24 48 24 C35 24 24 35 24 48 C24 35 13 24 0 24 C13 24 24 13 24 0 Z" fill="url(#goldGrad)" />
  </g>
</svg>
